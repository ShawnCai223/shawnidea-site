name: Sync from Notion

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:        # manual trigger from GitHub Actions tab

concurrency:
  group: notion-sync
  cancel-in-progress: false  # queue instead of cancel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DB: ${{ secrets.NOTION_BLOG_DB }}
          NOTION_PROJECTS_DB: ${{ secrets.NOTION_PROJECTS_DB }}
        run: npm run sync

      - name: Commit and push if content changed
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add src/content
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "content: auto-sync from Notion [skip ci]"
          git push
